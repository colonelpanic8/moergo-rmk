[package]
name = "moergo-rmk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared RMK firmware services for MoErgo keyboards"

[workspace]

[features]
glove80 = []
go60 = []

[dependencies]
rmk = { path = "../../dependencies/rmk/rmk", default-features = false, features = [
    "defmt",
    "storage",
    "rynk",
    "watchdog",
    "nrf52840_ble",
    "split",
    "async_matrix",
    "lighting",
    "adafruit_bl",
] }
rmk-palettefx = { path = "../../dependencies/rmk-palettefx", features = ["rmk-lighting"] }
defmt = "1"
embassy-futures = "0.1"
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }

[patch."https://github.com/colonelpanic8/rmk"]
rmk = { path = "../../dependencies/rmk/rmk" }
